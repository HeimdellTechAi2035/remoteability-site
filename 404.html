<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Page not found. Return to RemoteAbility CIC homepage." />
  <title>Page Not Found - RemoteAbility CIC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/jpeg" href="remoteability-cic-logo.jpg" />
  <style>
    .error-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e0f2fe, #7dd3fc, #e9d5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-size: 2rem;
      margin: 1rem 0;
    }
    .error-message {
      color: var(--muted);
      max-width: 500px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="bg-orbit"></div>
    <div class="bg-grid"></div>
    
    <div class="error-container">
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-message">
        The page you're looking for doesn't exist or has been moved. 
        Let's get you back on track.
      </p>
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <a href="/" style="text-decoration: none;">
          <button type="button" class="btn-primary">Go to Homepage</button>
        </a>
        <a href="/contact.html" style="text-decoration: none;">
          <button type="button" class="btn-outline">Contact Us</button>
        </a>
      </div>
    </div>
  </div>

  <script src="cookie-consent.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
