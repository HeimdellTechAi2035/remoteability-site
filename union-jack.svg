<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" role="img" aria-label="Union Jack flag">
  <rect width="60" height="30" fill="#012169"/>
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="butt">
    <line x1="0" y1="0" x2="60" y2="30"/>
    <line x1="60" y1="0" x2="0" y2="30"/>
  </g>
  <g stroke="#C8102E" stroke-width="2" stroke-linecap="butt">
    <line x1="0" y1="0" x2="30" y2="15" transform="translate(0,-1.2)"/>
    <line x1="30" y1="15" x2="60" y2="30" transform="translate(0,1.2)"/>
    <line x1="60" y1="0" x2="30" y2="15" transform="translate(0,-1.2)"/>
    <line x1="30" y1="15" x2="0" y2="30" transform="translate(0,1.2)"/>
  </g>
  <rect x="24" y="0" width="12" height="30" fill="#FFFFFF"/>
  <rect x="0" y="11" width="60" height="8" fill="#FFFFFF"/>
  <rect x="27" y="0" width="6" height="30" fill="#C8102E"/>
  <rect x="0" y="13" width="60" height="4" fill="#C8102E"/>
</svg>
